<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamArchive | 大学入試過去問データベース</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- KaTeX for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-shape shape-1"></div>
    <div class="background-shape shape-2"></div>
    
    <div class="app-container">
        <!-- Sidebar / Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                <span>ExamArchive</span>
            </div>
            
            <div class="filters">
                <h3>検索フィルター</h3>
                
                <div class="filter-group">
                    <label for="search-text">キーワード検索</label>
                    <input type="text" id="search-text" placeholder="問題文や大学名を入力...">
                </div>

                <div class="filter-group">
                    <label for="filter-university">大学名</label>
                    <select id="filter-university">
                        <option value="">すべての大学</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filter-year">年度</label>
                    <select id="filter-year">
                        <option value="">すべての年度</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filter-subject">科目</label>
                    <select id="filter-subject">
                        <option value="">すべての科目</option>
                    </select>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div>
                    <h1>過去問データベース</h1>
                    <p class="subtitle">全国の大学入試過去問を素早く検索・閲覧できます</p>
                </div>
                <div class="stats-badge" id="results-count">
                    0 件ヒット
                </div>
            </header>

            <div class="questions-grid" id="questions-container">
                <!-- Cards will be injected here via JS -->
            </div>
            
            <!-- Loading State -->
            <div id="loading" class="loading-container" style="display: none;">
                <div class="spinner"></div>
                <p>データを読み込み中...</p>
            </div>
            
            <!-- Empty State -->
            <div id="empty-state" class="empty-state" style="display: none;">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
                <h3>見つかりませんでした</h3>
                <p>検索条件を変更してお試しください。</p>
            </div>
        </main>
    </div>

    <!-- Modal for showing full question -->
    <div id="question-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" id="close-modal">×</button>
            <div class="modal-header">
                <div class="tags" id="modal-tags"></div>
                <h2 id="modal-title"></h2>
                <p class="modal-subtitle" id="modal-subtitle"></p>
            </div>
            <div class="modal-body">
                <p id="modal-text"></p>
            </div>
            <div class="modal-footer">
                <button class="btn-primary" onclick="window.print()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                    印刷する
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
